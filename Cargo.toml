[workspace]
resolver = "2"
members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/harshnagouda/openarchi"

[workspace.dependencies]
openarchi-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
